[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-ndvi"
version = "1.0.0"
description = "批量处理整个文件夹的 Sentinel-2 影像：算 NDVI、出统计、汇总出图"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rasterio>=1.3,<1.4",
    "affine==2.3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
batch-ndvi = "batch_ndvi.cli:main"

[tool.setuptools]
packages = ["batch_ndvi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
